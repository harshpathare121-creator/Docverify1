<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConnectID — Demo</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#111f33;--line:#24364e;--text:#f5f7fb;--muted:#9fb0c7;--accent:#65d7ff;--good:#62e6a7;--warn:#ffd36a;--bad:#ff7f91;--shadow:0 18px 50px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0a1728 50%,#07111f);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line);background:rgba(7,17,31,.9);backdrop-filter:blur(16px)}.brand{font-weight:800;letter-spacing:.3px;font-size:20px}.brand span{color:var(--accent)}.top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px 14px}.btn.primary{background:var(--accent);color:#06111b;border-color:var(--accent);font-weight:800}.btn.good{border-color:#2d7f61;color:var(--good)}.btn.bad{border-color:#773c48;color:var(--bad)}.btn.small{padding:7px 10px;font-size:13px}.iconbtn{width:42px;height:42px;padding:0;font-size:19px}.container{max-width:1160px;margin:0 auto;padding:34px 20px}.hero{max-width:760px;margin:45px auto 25px;text-align:center}.hero h1{font-size:48px;line-height:1.05;margin:0 0 12px}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);font-size:17px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(180deg,rgba(17,31,51,.96),rgba(13,26,43,.96));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.center{display:flex;justify-content:center;align-items:center}.auth{max-width:520px;margin:30px auto}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#081525;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{font-size:28px;font-weight:800}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#172941;border:1px solid var(--line);font-size:12px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0a1728}.item h4{margin:0 0 4px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:10px}.nav button.active{color:var(--text);border-color:var(--accent);background:#10243a}.notice{padding:12px;border-radius:12px;background:#0b1c2f;border:1px solid var(--line);margin-bottom:12px}.notice.error{border-color:#713b47;color:#ffb1bc}.notice.success{border-color:#2d6e57;color:#9af1c8}.otp{font-size:30px;letter-spacing:8px;text-align:center;font-weight:900;padding:16px;border:1px dashed var(--accent);border-radius:14px}.menu{position:fixed;right:18px;top:68px;z-index:50;width:220px;background:#0c192a;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}.menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;padding:11px;border-radius:9px}.menu button:hover{background:#14253b}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}.modalbox{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0b1829;border:1px solid var(--line);border-radius:18px;padding:20px}.kvs{display:grid;grid-template-columns:180px 1fr;gap:7px 12px}.json{white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#07111f;padding:10px;border-radius:10px;overflow:auto}.drop{border:1px dashed #49617e;border-radius:14px;padding:25px;text-align:center;background:#081525}.footer{text-align:center;color:var(--muted);padding:30px}.search{display:flex;gap:8px}.search input{flex:1}.badge{font-size:11px;color:var(--muted)}@media(max-width:800px){.cards,.grid,.grid3{grid-template-columns:1fr}.hero h1{font-size:38px}.top{padding:12px 14px}.container{padding:24px 14px}.kvs{grid-template-columns:1fr}.kvs div:nth-child(odd){margin-top:8px;font-weight:700;color:var(--muted)}}
</style>
</head>
<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#07111f;color:#f5f7fb;font-family:system-ui,sans-serif"><div><div style="font-size:28px;font-weight:800">Connect<span style="color:#65d7ff">ID</span></div><p style="color:#9fb0c7">Loading ConnectID…</p><noscript><p style="color:#ffb1bc">JavaScript is required for this demo.</p></noscript></div></div></div>
<div id="modal" class="modal hidden"></div>
<script>
const $=s=>document.querySelector(s);
const app=$("#app");
let state={screen:"home",tab:"dashboard",authType:null,me:null,docs:[],requests:[],notifications:[],audit:[],org:null,orgRequests:[],admin:null,adminUsers:[],adminOverview:null,adminOrgs:[],adminAudit:[],pendingEmail:"",pendingOtp:""};

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function token(){return localStorage.getItem("connectid_token")||""}
function setSession(t,role){localStorage.setItem("connectid_token",t);localStorage.setItem("connectid_role",role)}
function clearSession(){localStorage.removeItem("connectid_token");localStorage.removeItem("connectid_role");state={...state,screen:"home",me:null,docs:[],requests:[],notifications:[],audit:[],org:null,orgRequests:[],admin:null,adminUsers:[],adminOverview:null,adminOrgs:[],adminAudit:[]};render()}
async function api(url,opt={}){const headers={...(opt.headers||{})};if(token())headers.Authorization="Bearer "+token();let r=await fetch(url,{...opt,headers});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status===401&&token()){localStorage.removeItem('connectid_token');localStorage.removeItem('connectid_role');}throw new Error(data.error||"Request failed")}return data}
function topbar(){return `<header class="top"><div class="brand">Connect<span>ID</span></div><div class="top-actions">${state.screen!=="home"?`<button class="iconbtn" onclick="goHome()" title="Home">⌂</button>`:""}<button class="iconbtn" onclick="toggleMenu()" title="Options">⋮</button></div></header>`}
function menu(){return `<div id="menu" class="menu hidden"><button onclick="closeMenu();showAbout()">ℹ About</button><button onclick="closeMenu();showAdminLogin()">🔐 Admin Portal</button><button onclick="closeMenu();showOrgLogin()">🏢 Organization Portal</button>${token()?`<button onclick="closeMenu();clearSession()">↪ Log out</button>`:""}</div>`}
function shell(body){app.innerHTML=topbar()+menu()+`<main class="container">${body}</main><div class="footer">ConnectID demo • Backend database is the source of truth</div>`}
function toggleMenu(){const m=$("#menu");if(m)m.classList.toggle("hidden")}
function closeMenu(){const m=$("#menu");if(m)m.classList.add("hidden")}
function goHome(){state.screen="home";state.tab="dashboard";render()}
function showAbout(){openModal(`<h2>About ConnectID</h2><p class="muted">A demo identity-sharing platform where people control access to selected data and organizations request permission.</p><div class="notice"><b>Demo note:</b> OCR name matching is implemented for uploaded images/text PDFs, Gmail OTP is demo-mode, and the Admin Portal intentionally exposes full user records for demonstration purposes.</div><button class="btn" onclick="closeModal()">Close</button>`)}
function openModal(html){$("#modal").innerHTML=`<div class="modalbox">${html}</div>`;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
function notice(msg,type="error"){return `<div class="notice ${type}">${esc(msg)}</div>`}

function home(){
 shell(`<section class="hero"><h1>Your identity.<br><span>Your control.</span></h1><p>ConnectID lets people store identity documents, review access requests, and approve exactly what an organization can access.</p><div class="row center" style="margin-top:22px"><button class="btn primary" onclick="showRegister()">Create account</button><button class="btn" onclick="showLogin()">Sign in</button></div></section><section class="cards"><div class="card"><h3>👤 Person Portal</h3><p class="muted">Manage your identity data and control requests.</p></div><div class="card"><h3>🏢 Organization Portal</h3><p class="muted">Request selected data from a Person ID.</p></div><div class="card"><h3>🔐 Admin Portal</h3><p class="muted">Demo-only system view with full user records.</p></div></section>`)
}

function showRegister(){state.screen="register";state.pendingEmail="";state.pendingOtp="";render()}
function showLogin(){state.screen="login";render()}
function showOrgLogin(){state.screen="orgLogin";render()}
function showAdminLogin(){state.screen="adminLogin";render()}

function register(){
 shell(`<div class="auth card"><div class="between"><div><h2>Create your ConnectID</h2><p class="muted">Each new account gets its own permanent Person ID.</p></div><button class="btn small" onclick="goHome()">Home</button></div><div id="regMsg"></div><form class="form" onsubmit="submitRegister(event)"><div class="field"><label>Full name</label><input id="rName" required></div><div class="field"><label>Gmail address</label><input id="rEmail" type="email" placeholder="you@gmail.com" required></div><div class="field"><label>Mobile</label><input id="rMobile" placeholder="+91..."></div><div class="field"><label>Password</label><input id="rPass" type="password" minlength="8" required></div><button class="btn primary">Create account</button></form><p class="muted">Already registered? <button class="btn small" onclick="showLogin()">Sign in</button></p></div>`)
}
async function submitRegister(e){
 e.preventDefault();$("#regMsg").innerHTML=notice("Creating account...","success");
 try{const d=await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#rName").value,email:$("#rEmail").value,mobile:$("#rMobile").value,password:$("#rPass").value})});state.pendingEmail=d.email;state.pendingOtp=d.demoOtp||"";state.screen="verify";render()}catch(x){$("#regMsg").innerHTML=notice(x.message)}
}
function verify(){
 shell(`<div class="auth card"><h2>Verify Gmail</h2><p class="muted">Enter the verification code sent to <b>${esc(state.pendingEmail)}</b>.</p><div id="vMsg"></div>${state.pendingOtp?`<div class="notice success">Demo mode OTP: <b>${esc(state.pendingOtp)}</b></div>`:""}<form class="form" onsubmit="submitVerify(event)"><div class="field"><label>6-digit OTP</label><input id="vOtp" inputmode="numeric" maxlength="6" required></div><button class="btn primary">Verify & continue</button></form><button class="btn" onclick="showRegister()">Back</button></div>`)
}
async function submitVerify(e){e.preventDefault();$("#vMsg").innerHTML=notice("Verifying...","success");try{const d=await api("/api/auth/verify-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:state.pendingEmail,otp:$("#vOtp").value})});setSession(d.token,"person");await loadPerson();state.screen="person";render()}catch(x){$("#vMsg").innerHTML=notice(x.message)}}
function login(){
 shell(`<div class="auth card"><div class="between"><div><h2>Sign in</h2><p class="muted">Use your registered Gmail account.</p></div><button class="btn small" onclick="goHome()">Home</button></div><div id="lMsg"></div><form class="form" onsubmit="submitLogin(event)"><div class="field"><label>Gmail</label><input id="lEmail" type="email" required></div><div class="field"><label>Password</label><input id="lPass" type="password" required></div><button class="btn primary">Sign in</button></form><p class="muted">New here? <button class="btn small" onclick="showRegister()">Create account</button></p></div>`)
}
async function submitLogin(e){e.preventDefault();$("#lMsg").innerHTML=notice("Signing in...","success");try{const d=await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#lEmail").value,password:$("#lPass").value})});setSession(d.token,"person");await loadPerson();state.screen="person";render()}catch(x){$("#lMsg").innerHTML=notice(x.message)}}

async function loadPerson(){[state.me,state.docs,state.requests,state.notifications,state.audit]=await Promise.all([api("/api/me"),api("/api/documents"),api("/api/access-requests"),api("/api/notifications"),api("/api/audit")])}
function personNav(){return `<div class="nav">${["dashboard","documents","sharing","notifications","profile","security"].map(x=>`<button class="${state.tab===x?"active":""}" onclick="state.tab='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>`}
function person(){
 if(!state.me)return showLogin();
 shell(`<div class="between"><div><h2>Person Portal</h2><p class="muted">Welcome, ${esc(state.me.name)} • <b>${esc(state.me.person_id)}</b></p></div><button class="btn" onclick="clearSession()">Log out</button></div>${personNav()}${personTab()}`)
}
function personTab(){
 if(state.tab==="dashboard")return `<div class="grid3"><div class="card"><div class="muted">Person ID</div><div class="stat">${esc(state.me.person_id)}</div><button class="btn small" onclick="navigator.clipboard?.writeText('${esc(state.me.person_id)}')">Copy ID</button></div><div class="card"><div class="muted">Documents</div><div class="stat">${state.docs.length}</div></div><div class="card"><div class="muted">Unread notifications</div><div class="stat">${state.notifications.filter(x=>!x.read).length}</div></div></div><div class="card" style="margin-top:16px"><h3>Who has my data?</h3>${state.requests.length?state.requests.map(requestCard).join(""):`<p class="muted">No organization has requested your data yet.</p>`}</div>`
 if(state.tab==="documents")return `<div class="grid"><div class="card"><h3>Upload document</h3><p class="muted">The backend runs OCR on the uploaded document and compares the detected name with your registered profile name. A mismatch is rejected as an invalid file.</p><form class="form" onsubmit="uploadDoc(event)"><div class="drop"><input id="docFile" type="file" required></div><div class="field"><label>Document type</label><select id="docType"><option>Identity Document</option><option>Address Proof</option><option>Education Document</option><option>Other</option></select></div><button class="btn primary">Upload & process</button></form><div id="docMsg"></div></div><div class="card"><h3>My documents</h3>${state.docs.length?state.docs.map(d=>`<div class="item"><h4>${esc(d.original_name)}</h4><div class="badge">${esc(d.document_type)} • ${new Date(d.created_at).toLocaleString()}</div><div class="json">${esc(JSON.stringify(d.extracted||{},null,2))}</div></div>`).join(""):`<p class="muted">No documents uploaded.</p>`}</div></div>`
 if(state.tab==="sharing")return `<div class="card"><h3>Access history</h3>${state.requests.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Organization</th><th>Data</th><th>Purpose</th><th>Duration</th><th>Status</th><th></th></tr></thead><tbody>${state.requests.map(r=>`<tr><td>${esc(r.organization_name)}</td><td>${esc(r.requestedData.join(", "))}</td><td>${esc(r.purpose)}</td><td>${esc(r.duration)}</td><td><span class="pill ${r.status==="Granted"?"good":r.status==="Pending"?"warn":r.status==="Denied"?"bad":""}">${esc(r.status)}</span></td><td>${r.status==="Pending"?`<button class="btn small good" onclick="decide(${r.id},'approve')">Approve</button> <button class="btn small bad" onclick="decide(${r.id},'deny')">Deny</button>`:""}${r.status==="Granted"?`<button class="btn small bad" onclick="revoke(${r.id})">Revoke</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No access requests.</p>`}</div>`
 if(state.tab==="notifications")return `<div class="card"><h3>Notifications</h3>${state.notifications.length?state.notifications.map(n=>`<div class="item"><div class="between"><h4>${esc(n.title)}</h4>${n.read?"":"<span class='pill warn'>New</span>"}</div><p>${esc(n.message)}</p><div class="badge">${new Date(n.created_at).toLocaleString()}</div>${!n.read?`<br><button class="btn small" onclick="markRead(${n.id})">Mark read</button>`:""}</div>`).join(""):`<p class="muted">No notifications.</p>`}</div>`
 if(state.tab==="profile")return `<div class="card"><h3>Profile</h3><div class="kvs"><div>Person ID</div><div><b>${esc(state.me.person_id)}</b></div><div>Name</div><div>${esc(state.me.name)}</div><div>Gmail</div><div>${esc(state.me.email)}</div><div>Mobile</div><div>${esc(state.me.mobile||"Not provided")}</div><div>Verified</div><div>${state.me.email_verified?"Yes":"No"}</div><div>Created</div><div>${new Date(state.me.created_at).toLocaleString()}</div></div></div>`
 return `<div class="card"><h3>Security & activity</h3>${state.audit.length?state.audit.map(a=>`<div class="item"><b>${esc(a.action)}</b><div class="badge">${new Date(a.created_at).toLocaleString()} ${a.organization_name?`• ${esc(a.organization_name)}`:""}</div><div class="muted">${esc(a.details||"")}</div></div>`).join(""):`<p class="muted">No activity yet.</p>`}</div>`
}
function requestCard(r){return `<div class="item"><div class="between"><div><h4>${esc(r.organization_name)}</h4><div class="badge">${esc(r.organization_type)} • Request #${r.id}</div></div><span class="pill ${r.status==="Pending"?"warn":r.status==="Granted"?"good":r.status==="Denied"?"bad":""}">${esc(r.status)}</span></div><p>Requested: <b>${esc(r.requestedData.join(", "))}</b><br>Purpose: ${esc(r.purpose)}<br>Duration: ${esc(r.duration)}</p>${r.status==="Pending"?`<button class="btn small good" onclick="decide(${r.id},'approve')">Approve</button> <button class="btn small bad" onclick="decide(${r.id},'deny')">Deny</button>`:""}${r.status==="Granted"?`<button class="btn small bad" onclick="revoke(${r.id})">Revoke</button>`:""}</div>`}
async function uploadDoc(e){e.preventDefault();const f=$("#docFile").files[0];if(!f)return;$("#docMsg").innerHTML=notice("Reading document and verifying name with OCR...","success");const fd=new FormData();fd.append("document",f);fd.append("fullName",state.me.name);fd.append("personId",state.me.person_id);fd.append("documentType",$("#docType").value);try{const result=await api("/api/documents",{method:"POST",body:fd});await loadPerson();render();}catch(x){$("#docMsg").innerHTML=notice(x.message)}}
async function decide(id,decision){try{const d=await api("/api/access-requests/"+id+"/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision})});await loadPerson();if(d.demoOtp)openModal(`<h2>Approval OTP</h2><p class="muted">Demo OTP for the organization to complete authorization:</p><div class="otp">${esc(d.demoOtp)}</div><p class="muted">In a real deployment this would be delivered through the configured verification channel.</p><button class="btn primary" onclick="closeModal();render()">Done</button>`);else render()}catch(x){openModal(notice(x.message)+`<button class="btn" onclick="closeModal()">Close</button>`)}}
async function revoke(id){if(!confirm("Revoke this access?"))return;try{await api("/api/access-requests/"+id+"/revoke",{method:"POST"});await loadPerson();render()}catch(x){alert(x.message)}}
async function markRead(id){try{await api("/api/notifications/"+id+"/read",{method:"POST"});await loadPerson();render()}catch(x){alert(x.message)}}

function orgLogin(){
 shell(`<div class="auth card"><h2>Organization Portal</h2><p class="muted">Demo organization credentials.</p><div class="notice">Code: <b>HOSP001</b> • Password: <b>hospital123</b></div><div id="oMsg"></div><form class="form" onsubmit="submitOrgLogin(event)"><div class="field"><label>Organization code</label><input id="oCode" value="HOSP001" required></div><div class="field"><label>Password</label><input id="oPass" type="password" value="hospital123" required></div><button class="btn primary">Sign in</button></form><button class="btn" onclick="goHome()">Back</button></div>`)
}
async function submitOrgLogin(e){e.preventDefault();try{const d=await api("/api/org/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orgCode:$("#oCode").value,password:$("#oPass").value})});setSession(d.token,"organization");state.org=d.organization;await loadOrg();state.screen="org";render()}catch(x){$("#oMsg").innerHTML=notice(x.message)}}
async function loadOrg(){state.orgRequests=await api("/api/org/access-requests")}
function org(){
 shell(`<div class="between"><div><h2>Organization Portal</h2><p class="muted">${esc(state.org.name)} • ${esc(state.org.code)}</p></div><button class="btn" onclick="clearSession()">Log out</button></div><div class="grid" style="margin-top:16px"><div class="card"><h3>Request data</h3><form class="form" onsubmit="createRequest(event)"><div class="field"><label>Person ID</label><input id="pId" placeholder="PID-100245" required></div><div class="field"><label>Data requested</label><div class="row"><label><input type="checkbox" value="Full Name" class="reqdata"> Full Name</label><label><input type="checkbox" value="Email" class="reqdata"> Email</label><label><input type="checkbox" value="Mobile" class="reqdata"> Mobile</label><label><input type="checkbox" value="Identity Document" class="reqdata"> Identity Document</label></div></div><div class="field"><label>Purpose</label><input id="purpose" placeholder="Admission verification" required></div><div class="field"><label>Duration</label><select id="duration"><option>24 hours</option><option>7 days</option><option>30 days</option></select></div><button class="btn primary">Send access request</button></form><div id="oCreateMsg"></div></div><div class="card"><h3>My Requests</h3>${state.orgRequests.length?state.orgRequests.map(r=>`<div class="item"><div class="between"><div><h4>${esc(r.person_name)} • ${esc(r.person_id)}</h4><div class="badge">Request #${r.id}</div></div><span class="pill">${esc(r.status)}</span></div><p>${esc(r.requestedData.join(", "))}<br>${esc(r.purpose)} • ${esc(r.duration)}</p>${r.status==="Awaiting OTP"?`<button class="btn small primary" onclick="authorizeRequest(${r.id})">Enter OTP</button>`:""}${r.status==="Granted"?`<button class="btn small good" onclick="viewGranted(${r.id})">View granted data</button>`:""}</div>`).join(""):`<p class="muted">No requests yet.</p>`}</div></div>`)
}
async function createRequest(e){e.preventDefault();const data=[...document.querySelectorAll(".reqdata:checked")].map(x=>x.value);if(!data.length){$("#oCreateMsg").innerHTML=notice("Select at least one data item");return}try{await api("/api/access-requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({personId:$("#pId").value.trim(),requestedData:data,purpose:$("#purpose").value,duration:$("#duration").value})});await loadOrg();render()}catch(x){$("#oCreateMsg").innerHTML=notice(x.message)}}
async function authorizeRequest(id){const otp=prompt("Enter the approval OTP shown to the person in demo mode:");if(!otp)return;try{await api("/api/access-requests/"+id+"/authorize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({otp})});await loadOrg();render()}catch(x){alert(x.message)}}
async function viewGranted(id){try{const d=await api("/api/granted-data/"+id);openModal(`<h2>Granted data</h2><div class="kvs"><div>Person ID</div><div>${esc(d.access.personId)}</div><div>Name</div><div>${esc(d.access.name)}</div>${d.access.email?`<div>Email</div><div>${esc(d.access.email)}</div>`:""}${d.access.mobile?`<div>Mobile</div><div>${esc(d.access.mobile)}</div>`:""}<div>Purpose</div><div>${esc(d.purpose)}</div><div>Duration</div><div>${esc(d.duration)}</div></div><h3>Identity documents</h3>${d.documents?.length?d.documents.map(doc=>`<div class="item"><div class="between"><b>${esc(doc.name)}</b><button class="btn small" onclick="openGrantedDoc(${id},${doc.id})">View file</button></div><div class="badge">${esc(doc.type)} • ${new Date(doc.created_at).toLocaleString()}</div></div>`).join(""):`<p class="muted">No identity document has been uploaded.</p>`}<br><button class="btn primary" onclick="closeModal()">Close</button>`)}catch(x){alert(x.message)}}
async function openGrantedDoc(requestId,docId){try{const r=await fetch(`/api/granted-data/${requestId}/documents/${docId}/download`,{headers:{Authorization:'Bearer '+token()}});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||'Unable to open document')}const blob=await r.blob();const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(x){alert(x.message)}}

function adminLogin(){
 shell(`<div class="auth card"><h2>Admin Portal</h2><p class="muted">Demo-only administrator access. This view intentionally shows all user data for the prototype.</p><div class="notice">Demo admin: <b>ADMIN001</b> • Password: <b>admin12345</b></div><div id="aMsg"></div><form class="form" onsubmit="submitAdminLogin(event)"><div class="field"><label>Admin code</label><input id="aCode" value="ADMIN001" required></div><div class="field"><label>Password</label><input id="aPass" type="password" value="admin12345" required></div><button class="btn primary">Open Admin Portal</button></form><button class="btn" onclick="goHome()">Back</button></div>`)
}
async function submitAdminLogin(e){e.preventDefault();try{const d=await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminCode:$("#aCode").value,password:$("#aPass").value})});setSession(d.token,"admin");state.admin=d.admin;await loadAdmin();state.screen="admin";render()}catch(x){$("#aMsg").innerHTML=notice(x.message)}}
async function loadAdmin(){[state.adminOverview,state.adminUsers,state.adminOrgs,state.adminAudit]=await Promise.all([api("/api/admin/overview"),api("/api/admin/users"),api("/api/admin/organizations"),api("/api/admin/audit")])}
function admin(){
 shell(`<div class="between"><div><h2>Admin Portal</h2><p class="muted">Demo administrator • Full user records</p></div><button class="btn" onclick="clearSession()">Log out</button></div><div class="grid3" style="margin-top:16px">${[["Users",state.adminOverview.users],["Verified",state.adminOverview.verifiedUsers],["Documents",state.adminOverview.documents],["Requests",state.adminOverview.requests],["Pending",state.adminOverview.pending],["Granted",state.adminOverview.granted]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join("")}</div><div class="card" style="margin-top:16px"><div class="between"><h3>All registered users</h3><input id="adminSearch" placeholder="Search name, Gmail or Person ID" oninput="filterAdminUsers()" style="max-width:320px;background:#081525;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)"></div><div id="adminUsersList" class="list" style="margin-top:12px">${adminUserCards(state.adminUsers)}</div></div><div class="grid" style="margin-top:16px"><div class="card"><h3>Organizations</h3><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Type</th></tr></thead><tbody>${state.adminOrgs.map(o=>`<tr><td>${esc(o.org_code)}</td><td>${esc(o.name)}</td><td>${esc(o.type)}</td></tr>`).join("")}</tbody></table></div></div><div class="card"><h3>System audit</h3>${state.adminAudit.slice(0,30).map(a=>`<div class="item"><b>${esc(a.action)}</b><div>${esc(a.person_name||a.person_id||"System")} ${a.organization_name?`• ${esc(a.organization_name)}`:""}</div><div class="badge">${new Date(a.created_at).toLocaleString()}</div></div>`).join("")||`<p class="muted">No audit records.</p>`}</div></div>`)
}
function adminUserCards(users){return users.length?users.map(u=>`<div class="item"><div class="between"><div><h3>${esc(u.name)}</h3><div class="muted">${esc(u.person_id)} • ${esc(u.email)}</div></div><span class="pill ${u.email_verified?"good":"warn"}">${u.email_verified?"Verified":"Unverified"}</span></div><p class="badge">Mobile: ${esc(u.mobile||"Not provided")} • Joined: ${new Date(u.created_at).toLocaleString()}</p><div class="row"><span class="pill">${u.documents.length} documents</span><span class="pill">${u.accessRequests.length} requests</span><span class="pill">${u.notifications.length} notifications</span><span class="pill">${u.audit.length} audit events</span></div><br><button class="btn small primary" onclick="showAdminUser(${u.id})">View all user data</button></div>`).join(""):`<p class="muted">No users yet.</p>`}
function filterAdminUsers(){const q=$("#adminSearch").value.toLowerCase();$("#adminUsersList").innerHTML=adminUserCards(state.adminUsers.filter(u=>[u.name,u.email,u.person_id,u.mobile].join(" ").toLowerCase().includes(q)))}
async function downloadAdminDoc(id){try{const r=await fetch('/api/admin/documents/'+id+'/download',{headers:{Authorization:'Bearer '+token()}});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||'Unable to open document')}const blob=await r.blob();const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(x){alert(x.message)}}
function showAdminUser(id){const u=state.adminUsers.find(x=>x.id===id);if(!u)return;openModal(`<div class="between"><div><h2>${esc(u.name)}</h2><p class="muted">${esc(u.person_id)}</p></div><button class="btn" onclick="closeModal()">Close</button></div><h3>Account</h3><div class="kvs"><div>Person ID</div><div><b>${esc(u.person_id)}</b></div><div>Name</div><div>${esc(u.name)}</div><div>Gmail</div><div>${esc(u.email)}</div><div>Mobile</div><div>${esc(u.mobile||"Not provided")}</div><div>Verified</div><div>${u.email_verified?"Yes":"No"}</div><div>Created</div><div>${new Date(u.created_at).toLocaleString()}</div></div><h3>Documents (${u.documents.length})</h3>${u.documents.map(d=>`<div class="item"><div class="between"><b>${esc(d.original_name)}</b><button class="btn small" onclick="downloadAdminDoc(${d.id})">View file</button></div><div class="badge">${esc(d.document_type)} • ${new Date(d.created_at).toLocaleString()}</div><div class="json">${esc(JSON.stringify(d.extracted||{},null,2))}</div></div>`).join("")||`<p class="muted">No documents.</p>`}<h3>Access requests (${u.accessRequests.length})</h3>${u.accessRequests.map(r=>`<div class="item"><b>#${r.id} • ${esc(r.organization_name)}</b><div>${esc(r.requestedData.join(", "))} • ${esc(r.status)}</div><div>Purpose: ${esc(r.purpose)} • Duration: ${esc(r.duration)}</div></div>`).join("")||`<p class="muted">No requests.</p>`}<h3>Notifications (${u.notifications.length})</h3>${u.notifications.map(n=>`<div class="item"><b>${esc(n.title)}</b><div>${esc(n.message)}</div><div class="badge">${new Date(n.created_at).toLocaleString()}</div></div>`).join("")||`<p class="muted">No notifications.</p>`}<h3>Activity (${u.audit.length})</h3>${u.audit.map(a=>`<div class="item"><b>${esc(a.action)}</b><div>${esc(a.details||"")}</div><div class="badge">${new Date(a.created_at).toLocaleString()}</div></div>`).join("")||`<p class="muted">No activity.</p>`}`)}

function render(){
 if(state.screen==="home")return home();
 if(state.screen==="register")return register();
 if(state.screen==="verify")return verify();
 if(state.screen==="login")return login();
 if(state.screen==="orgLogin")return orgLogin();
 if(state.screen==="adminLogin")return adminLogin();
 if(state.screen==="person")return person();
 if(state.screen==="org")return org();
 if(state.screen==="admin")return admin();
 home();
}
async function restoreSession(){const role=localStorage.getItem('connectid_role');if(!token()||!role){render();return}try{if(role==='person'){state.me=await api('/api/me');[state.docs,state.requests,state.notifications,state.audit]=await Promise.all([api('/api/documents'),api('/api/access-requests'),api('/api/notifications'),api('/api/audit')]);state.screen='person'}else if(role==='organization'){state.org=await api('/api/org/me');await loadOrg();state.screen='org'}else if(role==='admin'){state.admin=await api('/api/admin/me');await loadAdmin();state.screen='admin'}else{clearSession();return}render()}catch(e){localStorage.removeItem('connectid_token');localStorage.removeItem('connectid_role');state.screen='home';render()}}
(async()=>{await restoreSession()})();
</script>
</body>
</html>
